name: Daily Auto Commit

on:
  schedule:
    - cron: '0 2 * * *'  # 9:00 AM Vietnam time (UTC+7)
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_1 }}

      - name: Configure Git
        run: |
          git config user.name "truonganDevOps"
          git config user.email "truonganDevOps@users.noreply.github.com"

      - name: Generate commits
        run: python3 commit.py

      - name: Push
        run: git push
